[project]
name = "hermes-agent"
version = "2.1.5-rc.3"
description = "Hermes v2 — stateful, low-noise, AI-assisted autonomous operations agent for Unraid"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "PyYAML>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
hermes = "hermes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"]
