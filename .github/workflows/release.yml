name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG" = "$PY_VERSION" ] || { echo "tag $TAG != pyproject $PY_VERSION"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install + test
        run: |
          pip install aiohttp PyYAML pydantic pytest pytest-asyncio ruff
          ruff check hermes tests
          python -m pytest tests/ -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
      - name: Release notes with traceability
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Hermes ${{ github.ref_name }}

            - image: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - git sha: `${{ github.sha }}`
            - build time: `${{ github.event.head_commit.timestamp }}`
            - digest: zie het `ghcr.io`-pakket (immutable version tag)
          generate_release_notes: true
