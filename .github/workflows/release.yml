name: release

# Stable release pipeline. Pushing an immutable tag vMAJOR.MINOR.PATCH runs:
# gate (tag == pyproject version) -> tests -> lint -> build -> GHCR publish
# -> GitHub release with traceability.
#
# Prereleases (tags containing "-", e.g. v2.1.5-rc.2) publish their exact
# version tag plus the X.Y-rc channel but NEVER move `latest` or `X.Y`.
#
# Hard rule (docs/RELEASE.md): once pushed, a tag is never moved or deleted.
# A broken release is fixed by the next patch version. The preflight below
# refuses a run whose tag no longer points at the built commit.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release preflight - immutable tag policy (never move a published tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # A normal tag push creates the remote tag, so "tag exists" alone is
          # NOT a violation. A violation is a MOVED tag: the tag on the remote
          # no longer points at the commit this run was triggered for.
          # (Annotated tags: dereference with ^{} to compare the commit.)
          REMOTE_SHA=$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | awk '{print $1}')
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "${GITHUB_SHA}" ]; then
            echo "REFUSING: tag ${GITHUB_REF_NAME} was moved remotely (immutable tag policy)."
            echo "Remote tag points at ${REMOTE_SHA:-none}; this build is ${GITHUB_SHA}."
            echo "Release the next patch version instead."
            exit 1
          fi
          echo "preflight OK: tag ${GITHUB_REF_NAME} still points at ${GITHUB_SHA}"

      - name: Verify tag matches package version (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG" = "$PY_VERSION" ] || { echo "tag $TAG != pyproject $PY_VERSION"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the project itself (single source of truth for deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check hermes tests

      - name: Tests
        run: python -m pytest tests/ -q

      - uses: docker/setup-buildx-action@v3
      - name: Resolve build time (head_commit is empty on tag pushes)
        id: bt
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto: prereleases (rc) never move `latest`
          flavor: latest=${{ !contains(github.ref_name, '-') }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}-rc,enable=${{ contains(github.ref_name, '-rc') }}

      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.bt.outputs.time }}

      - name: Build sanity (no push) on dispatch runs
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hermes-agent:dispatch-check

      - name: Release notes with traceability
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Hermes ${{ github.ref_name }}

            - image: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - git sha: `${{ github.sha }}`
            - build time: `${{ steps.bt.outputs.time }}`
            - digest: see the `ghcr.io` package (immutable version tag)
          generate_release_notes: true
