name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp PyYAML pydantic pytest pytest-asyncio ruff
      - name: Lint (ruff)
        run: ruff check hermes tests
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Verify no secrets in tree
        run: |
          ! grep -rEn "(bot[0-9]{6,}:[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{16,})" --include="*.py" --include="*.yaml" --include="*.yml" hermes config unraid .github

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hermes-agent:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
