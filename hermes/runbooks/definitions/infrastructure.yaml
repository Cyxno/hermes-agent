# Runbook definitions — infrastructure & observability (spec §21).
storage_latency:
  description: >
    Disk-await or iowait band active. Always diagnosis-only: the cause lies in
    workload or hardware, not in a single container. Correlation generates the
    root incident; this runbook supplies evidence to AI/human.
  detect: [disk_await_ms, host_iowait_pct]
  possible_causes:
    - heavy IO workload (backups, parity check, scraper)
    - failing disk (see SMART via Beacon issues)
    - cache pool full or fragmentation
  preconditions: []
  diagnose: []
  actions: []
  verification: []
  escalation_criteria: []

filesystem_readonly:
  description: >
    Read-only filesystem. NEVER act automatically; escalate to a human
    immediately.
  detect: [filesystem_readonly]
  possible_causes:
    - filesystem error; array in protected mode
    - hardware failure
  preconditions: []
  diagnose: []
  actions: []
  verification: []
  escalation_criteria: []

network_packet_loss:
  description: >
    Network errors or drops. Diagnosis-only with interface evidence.
  detect: [net_errors_per_s]
  possible_causes:
    - cable/NIC problem
    - driver or bridge issue
    - external network outage
  preconditions: []
  diagnose: []
  actions: []
  verification: []
  escalation_criteria: []

beacon_unavailable:
  description: >
    Beacon unreachable while the host responds via fallback. Diagnoses whether
    Beacon itself or the link is the problem; no automatic actions against
    Beacon (Beacon is infrastructure, not a Hermes-managed service).
  detect: [beacon_unavailable, beacon_stale]
  possible_causes:
    - beacon container stopped or restarting
    - network/proxy problem
    - Agent API disabled (config)
  preconditions: []
  diagnose: []
  actions: []
  verification: []
  escalation_criteria: []

netdata_unavailable:
  description: >
    Netdata unreachable. Hermes continues on Beacon alone and marks
    observability degraded; diagnosis-only.
  detect: [netdata_unavailable]
  possible_causes:
    - netdata container stopped
    - port/config change
  preconditions: []
  diagnose: []
  actions: []
  verification: []
  escalation_criteria: []
