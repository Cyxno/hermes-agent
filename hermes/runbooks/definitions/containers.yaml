# Runbook definitions — container lifecycle (spec §21/§22).
# Deterministic: preconditions + diagnose checks gate every action.
container_unhealthy:
  description: >
    Container is running but reports unhealthy. Diagnoses dependencies,
    storage and network; restarts only when everything else is healthy and no
    update/restart loop is in progress.
  detect: [container_unhealthy]
  possible_causes:
    - internal application error or deadlock
    - unhealthy dependency (database/backup service)
    - storage or network degradation
    - update waiting on a restart
  preconditions: [container_exists, not_restart_looping, no_active_update]
  diagnose: [dependencies_healthy, storage_healthy, network_healthy]
  actions:
    - capability: docker.restart
  verification: [container_running, container_healthy]
  settle_seconds: 90
  escalation_criteria: [action_failed, verification_failed]

container_exit:
  description: >
    Managed container is not running. Start it only when dependencies and
    storage are healthy; otherwise the cause lies elsewhere and a restart
    would only treat the symptom.
  detect: [container_exit]
  possible_causes:
    - crash/OOM
    - manually stopped without a desired-state update
    - dependency storage unavailable
  preconditions: [container_exists, not_restart_looping, no_active_update]
  diagnose: [dependencies_healthy, storage_healthy]
  actions:
    - capability: docker.start
  verification: [container_running, container_healthy]
  settle_seconds: 120
  escalation_criteria: [action_failed, verification_failed]

container_restart_loop:
  description: >
    Container restarts repeatedly within the window. Deliberately NO restart:
    it feeds the loop. Diagnosis-only, escalates to AI/human with evidence.
  detect: [container_restart_loop]
  possible_causes:
    - crash loop caused by a configuration error
    - dependency failing at startup
    - resource limit (OOM)
  preconditions: [container_exists]
  diagnose: [dependencies_healthy, storage_healthy]
  actions: []
  verification: []
  escalation_criteria: [action_failed, verification_failed]

container_high_cpu:
  description: >
    Sustained high CPU throttling. Diagnosis-only: an automatic restart rarely
    fixes this safely; AI/human receives compact evidence.
  detect: [container_cpu_throttle_pct, container_high_cpu]
  possible_causes:
    - runaway process inside the container
    - CPU limit set too low
    - external load (backups, scrapers)
  preconditions: [container_exists]
  diagnose: [storage_healthy, network_healthy]
  actions: []
  verification: []
  escalation_criteria: []

container_memory_pressure:
  description: >
    Container is at its memory limit. Diagnosis-only; OOM risk is reported
    with baseline context.
  detect: [container_mem_util_pct, container_memory_pressure]
  possible_causes:
    - workload spike
    - limit set too tight
    - memory leak
  preconditions: [container_exists]
  diagnose: [memory_leak_trend]
  actions: []
  verification: []
  escalation_criteria: []

container_memory_leak:
  description: >
    Memory grows structurally above baseline. Diagnoses the leak trend;
    restarts only when the trend is proven and the container is managed.
  detect: [container_memory_leak]
  possible_causes:
    - memory leak in the application
    - unbounded cache growth
  preconditions: [container_exists, not_restart_looping]
  diagnose: [memory_leak_trend]
  actions:
    - capability: docker.restart
  verification: [container_running, container_healthy]
  settle_seconds: 120
  escalation_criteria: [action_failed, verification_failed]
