services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/hermes-agent.png"
      net.unraid.docker.managed: "dockerman"
      net.unraid.docker.shell: "bash"
    command: gateway run
    ports:
      - "8642:8642"
    volumes:
      - /mnt/user/appdata/hermes/data:/opt/data
    environment:
      TZ: Europe/Amsterdam
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    security_opt:
      - no-new-privileges:true
