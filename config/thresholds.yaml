# thresholds.yaml — deterministische drempels voor de Hermes-evaluator.
#
# STATUS: ALLE PROFIELEN STAAN OP baseline_pending: true.
# De waarden hieronder zijn conservatieve safety-limits.
# Na 24-48 uur dry-run levert `hermes_evaluator.py baseline-report` min/p50/p95/p99/max
# per metriek; goedgekeurde banden worden hier ingevuld en krijgen
# baseline_pending: false. Aanpassen = dit bestand wijzigen, geen codewijziging.
#
# Semantiek per profiel:
#   notice/warning/urgent/critical = drempel voor binnenkomst van de band
#   exit_margin                    = hysteresis-uitgang (drempel - margin)
#   sustained_samples              = aantal opeenvolgende 5-min-samples boven drempel
#   rise_rate_per_hour             = extra versnelling (+1 severity-niveau)
#
# Overkoepelend: OOM-kill event, read-only remount of niet-gemounte Docker-vDisk
# zijn ALTIJD direct CRITICAL, onafhankelijk van deze banden.
# Swap-activering alleen is maximaal WARNING (host heeft standaard geen swap).
#
# FASE-4-REVIEW (2026-09-20, 48u samples n=576 + 7d Prometheus):
# geen enkele numerieke drempel aangepast. Onderbouwing per sectie in het
# fase-4-rapport; kern: opslag/log/vdisk-banden zitten ver boven de gemeten
# baselines (p99 < warn overal) en zijn capaciteitsgrenzen, geen idle-tuning;
# temperaturen zijn bimodaal (nachtelijk 91-100C) — band 90/95/100 + notice-cap
# + sustained doet precies wat ontworpen; memory vergelijkbaar. Hiermee is de
# bestaande waarde per metric "logisch" en is wijzigen niet datagedragen.
# baseline_pending blijft true pending expliciete operator-goedkeuring.

version: 1

defaults:
  baseline_pending: true
  sustained_samples: 2
  exit_margin_pp: 5
  flap_cooldown_minutes: 30

memory:
  baseline_pending: true
  warn_pct: 90
  urgent_pct: 95
  critical_pct: 97
  critical_when_oom: true
  rise_rate_pct_per_hour: 5
  oom_event_severity: critical
  note: "available-mem weegt mee; PSI bepaalt onderscheid warning vs urgent"

psi:
  baseline_pending: true
  unavailable_on_host: true
  note: "/proc/pressure bestaat niet op deze host (Unraid-kernel zonder PSI); regels blijven inactief, gebruik memory/OOM/load"
  memory_some_avg10_warn: 20
  memory_full_avg10_urgent: 10
  io_full_avg10_warn: 20

swap:
  baseline_pending: true
  appear_severity: notice
  used_kb_warn: 262144
  critical_only_with_oom_or_psi: true

docker_vdisk:
  baseline_pending: true
  warn_pct: 85
  urgent_pct: 90
  critical_pct: 95
  growth_warn_gb_per_hour: 2
  source: "df -kP /var/lib/docker (loop2, xfs) = GUI-authoritatief"
  not_mounted_severity: critical
  note: "growth-grens is per UUR (GiB/uur); d1h wordt niet meer geëxtrapoleerd naar 24u"

logfs:
  baseline_pending: true
  warn_pct: 70
  urgent_pct: 85
  critical_pct: 95
  growth_warn_pp_per_hour: 5
  note: "klein tmpfs (128M): snelle groei weegt zwaarder dan absolute hoogte"

storage:
  baseline_pending: true
  warn_pct: 80
  urgent_pct: 88
  critical_pct: 94
  applies_to: [cache, vm_storage, rootfs, user_share]

temperatures:
  baseline_pending: true
  package_warn_c: 95
  package_urgent_c: 98
  package_critical_c: 100
  critical_needs_sustain: true
  urgent_sustained_samples: 3
  ssd_warn_c: 60
  ssd_urgent_c: 70
  sustained_minutes: 10
  note: "§7b micro-spike-beleid (2026-09-23, high-res CPU-audit): één sample >=95
    = notice (geen Telegram), 2 opeenvolgende >=95 = warning, >=95 sustained
    >=10 min (3 samples à 5 min) = urgent, één 100C-sample = notice
    (critical_needs_sustain — de volgende sample moet bevestigen), sustained
    100C = critical. Geen rate-escalatie meer voor temperaturen; geen
    Telegram bij notice (alerts.notice_send=false + notifier min_severity)."

recovery:
  baseline_pending: true
  good_samples_to_resolve: 2
  note: "WARNING → RECOVERING (eerste goede sample) → RESOLVED (na N goede samples)"

dumbscope:
  baseline_pending: true
  base_url: "http://192.168.1.2:8091"
  username: "remco"
  timeout_s: 15
  failure_warning_polls: 3
  failure_urgent_polls: 12
  resolved_poll_limit: 20
  note: "severity-mapping: info->notice, warning->warning, critical->critical; onbekend->notice (gemarkeerd). Wachtwoord uit secrets/dumbscope-admin-password.txt (fallback: arrsight-admin-password.txt); sessie in secrets/dumbscope-session. Alleen GET + login; /api/actions nooit."

prometheus:
  baseline_pending: true
  enabled: true
  base_url: "http://192.168.1.2:9090"
  timeout_s: 5
  freshness_s: 600        # oudere data = stale -> genegeerd (samples.db fallback)
  cache_ttl_s: 600
  max_queries_per_run: 4  # max metrics per evaluator-run; <=2 ranges per metric
  failure_notice_polls: 3   # lokaal notice-event (geen Telegram)
  failure_warning_polls: 12 # langdurig (~3u) -> warning -> fase-4.5 policy
  note: "READ-ONLY (fase 6). Prometheus = langere historie; SSH/sampler blijft
    CURRENT-truth, samples.db = korte historie/fallback. Uitval is nooit een
    harde dependency: alleen context ontbreekt."

netdata:
  baseline_pending: true
  enabled: true
  base_url: "http://192.168.1.2:19999"
  timeout_s: 8
  failure_warning_polls: 3
  failure_urgent_polls: 12
  note: "READ-ONLY (fase 8): uitsluitend GET /api/v1/alarms; nooit alerts/silencers wijzigen. Allowlist: container-health, host-CPU/iowait, load, ram, oom-space-time, swap, disk space/inode, net-drops/fifo, thermals; cgroups en overige alarms genegeerd (geen blind doorsturen). Dedup: covered metrics (memory, temperaturen, disk-space, containers via dumbscope/unhealthy) zijn evidence-only; netdata-critical telt daar alleen bij bevestiging door eigen hermes-sample. Covered = hermes blijft leidend. Recovery = alarm verdwijnt uit de active-set na een geslaagde poll; mislukte polls raken state niet."

llm:
  baseline_pending: true
  # fase 5 ACTIEF (sinds Stap C van de vervolgfase): limits hieronder gelden.
  # Telegram-alerting (fase 4.5) blijft onafhankelijk van deze laag.
  enabled: true
  confidence_stop: 0.85
  max_calls_per_incident: 3
  max_calls_per_day: 8
  ling_input_chars_cap: 4800
  deepseek_input_chars_cap: 24000
  output_max_tokens:
    tier1: 300
    tier2: 1000
    tier3: 900
    tier4: 700
  note: "router: één model per call, allow_fallbacks=false, requested==actual gecontroleerd; Ling zonder response_format en met reasoning uit; GLM alleen als DeepSeek-providerfout; Luna alleen urgent/critical + multi-system + conf<0.5. Gezonde dag = 0 calls."

docker_daemon:
  baseline_pending: true
  unreachable_severity: critical
  unexpected_exit_warn: true
  restart_loop_delta: 3
  restart_loop_window_minutes: 15
  known_stopped: [hermes]
  note: "hermes is bewust gestopt; bekende containers alleen NOTICE-classificatie"

counters:
  baseline_pending: true
  crc_jump_warning: 50
  note: "monotone counters: alleen delta is een event; eerste waarneming = baseline"

array_disks:
  baseline_pending: true
  # Alleen in de hourly/deep laag (smartctl); sampler raakt arraydisks niet.
  pending_sector_warn: 1
  reallocated_growth_critical: true
  temp_warn_c: 50
  temp_urgent_c: 55

alerts:
  baseline_pending: true
  notice_send: false
  warning_send_new_or_worse: true
  urgent_send_immediately: true
  critical_send_immediately: true
  resolved_send_once: true

correlation:
  baseline_pending: true
  enabled: true
  window_hours: 2
  max_items: 5
  occurrence_days: 7
  occurrence_min: 3
  cluster_minutes: 150
  note: "fase 4: deterministische change-correlation + recurrentie-detectie.
    Gezonde runs: 0 LLM-calls, hooguit een stat()-call (deploy-log cursor).
    Correlation levert hypotheses/context, nooit causaliteit. Bronnen:
    container started/state (deep), deploy/rollback-events
    (homelab/changes-deploy.jsonl), parity/resync-start; occurrence_log
    (new/escalated/reopened) voor patronen. Minder dan occurrence_min
    occurrences binnen occurrence_days dagen = expliciet geen patroonclaim."

infinidysk:
  baseline_pending: true
  log_path: "/opt/dumblog/infinidysk.log"
  log_tz: "Europe/Amsterdam"
  warning_count: 5
  urgent_count: 10
  window_minutes: 60
  resolve_after_minutes: 120
  initial_backlog_hours: 24
  note: "fase 7: per-bestand repair-loop-detectie (read-only hostlog via /opt/dumblog-mount). >=5 repairs/60min = warning, >=10 = urgent, 1-4 blijft open als notice tot 120 min rust -> resolved (bestaande state-machine). Dedup: alleen new/escalated/reopened/resolved zijn notificatie-waardig, identieke runs geen event. Bekende reden (430/no such article/missing articles/DMCA/missing segments) = Tier-0 LLM-skip; onzekere reden route naar bestaande LLM-policy. Fingerprint = genormaliseerd pad (hoofdletters, /content/<cat>/-wortel, kopie-suffix '(2)' op releasedir geneutraliseerd); ander bestand = ander incident. Retentie: repairs 3h (cap 20k), loop-state 7d zonder repairs (cap 500)."
